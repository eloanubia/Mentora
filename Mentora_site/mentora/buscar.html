<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentora</title>
  <link rel="icon" type="image/png" href="Imagens/capelo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- O MENU NÃO FOI CRIADO DIRETAMENTE AQUI. ELE FOI CRIADO NO JAVASCRIPT ATRAVÉS DA FUNÇÃO montarMenu() -->
  <div id="menu"></div>

  <!-- Cria um cabeçalho centralizado e com margem interna -->
  <div class="cabecalho">
    <div class="container linha" style="margin:0 auto; padding:20px">

      <!-- Cria uma área de boas-vindas flexível com saudação dinâmica e subtítulo -->
      <div class="cresce">
        <h2 id="ola" style="margin:0"></h2>
        <small>O que você quer aprender hoje?</small>
      </div>

      <!-- Agrupa os botões das abas -->
      <div class="abas">
        <button data-aba="buscar" class="ativo" onclick="trocarAba('buscar')">Buscar</button>
        <button data-aba="aulas" onclick="trocarAba('aulas')">Minhas Aulas</button>
        <button data-aba="perfil" onclick="trocarAba('perfil')">Perfil</button>
      </div>

    </div>
  </div>

  <!-- Container que agrupa as três áreas de conteúdo -->
  <div class="container">

    <!-- Aba de busca: "ativa" deixa a área visível inicialmente -->
    <div class="aba ativa" id="aba-buscar">

      <!-- A função filtrarDigitando() filtra os resultados enquanto o aluno digita -->
      <input type="text" id="busca" placeholder="Buscar professor ou disciplina..." oninput="filtrarDigitando()">

      <!-- As categorias são inseridas posteriormente pelo JavaScript -->
      <div id="categorias" style="margin:14px 0"></div>

      <!-- Exibe a quantidade de resultados encontrados -->
      <p><small id="total"></small></p>

      <!-- Organiza os professores em formato de grade -->
      <div id="lista" class="grade"></div>

    </div>

    <!-- Aba de Minhas Aulas -->
    <div class="aba" id="aba-aulas">
      <h2>Minhas aulas</h2>
      <div id="aulas"></div>
    </div>

    <!-- Terceira aba, destinada às informações da conta do usuário -->
    <div class="aba" id="aba-perfil">
      <h2>Meu perfil</h2>

      <!-- Cartão de perfil que exibe o avatar circular com a inicial, o nome e o e-mail -->
      <div class="card linha">
        <span class="avatar grande" id="inicial" style="background:var(--laranja); color:#fff; border-radius:50%"></span>
        <div>
          <b id="nome"></b><br>
          <small class="laranja" id="email"></small>
        </div>
      </div>

      <a href="professor-cadastro.html" class="menu-item">🎓 Quero dar aulas</a>

      <!-- O onclick chama a função responsável por encerrar a sessão do usuário -->
      <a href="#" class="menu-item" onclick="sair(); return false;">🚪 Sair</a>
    </div>

  </div>

  <script src="api.js"></script>
  <script src="script.js"></script>

  <script>
    // Verifica se o usuário está autenticado
    if (exigirLogin()) {
      mostrarPerfilAluno(); // Carrega nome, e-mail e inicial do aluno
      montarCategorias();   // Monta as categorias de disciplinas disponíveis
      filtrar();            // Filtra os professores conforme a busca e os filtros
      mostrarAulas();       // Carrega e exibe as aulas do aluno
    }
  </script>

</body>
</html>
