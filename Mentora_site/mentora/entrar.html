
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentora</title>
  <link rel="icon" type="image/png" href="Imagens/capelo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- O MENU NÃO FOI CRIADO DIRETAMENTE AQUI. ELE FOI CRIADO NO JAVASCRIPT ATRAVÉS DA FUNÇÃO montarMenu() -->
  <div id="menu"></div>

  <!-- Aplica duas classes do CSS: container e estreito -->
  <div class="container estreito">

    <a href="index.html">← Voltar</a>
    <h1>Entrar</h1>
    <p><small>Acesse sua conta Mentora</small></p>

    <form class="card" onsubmit="entrar(event)">

      <label>E-mail</label>
      <input type="email" name="email" placeholder="maria@email.com" required>
      <!-- O placeholder mostra um exemplo do que deve ser digitado no campo -->

      <label>Senha</label>
      <input type="password" name="senha" required>

      <button class="btn btn-largo" style="width:100%">Entrar</button>

      <p class="centro">
        <small>
          Ainda não tem conta?
          <a href="cadastro.html" class="laranja">Cadastre-se</a>
        </small>
      </p>

    </form>
  </div>

  <!-- Conecta o arquivo api.js ao HTML, responsável pela comunicação com o servidor -->
  <script src="api.js"></script>

  <!-- Conecta o arquivo que contém as interações com a página -->
  <script src="script.js"></script>

  <!-- Chama a função responsável por criar o menu da página -->
  <script>montarMenu();</script>

</body>
</html>
